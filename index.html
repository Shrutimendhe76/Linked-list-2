<!DOCTYPE html>
<html>
<head>

    <title>Music Playlist Manager</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #2d2435;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            background: #111111;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #e58cff;
        }

        h2 {
            color: #e58cff;
        }

        .form-box,
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #3d3d3d;
            color: white;
            font-size: 14px;
            outline: none;
        }

        input::placeholder {
            color: #cccccc;
        }

        button {
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background: #9145b5;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #71358e;
        }

        .song {
            background: #29232d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-info {
            font-size: 16px;
            color: white;
            line-height: 1.5;
        }

        .delete-btn {
            background: #e74c3c;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        #message {
            text-align: center;
            font-weight: bold;
            color: #e58cff;
            min-height: 25px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🎵 Music Playlist Manager</h1>

        <!-- ADD SONG -->

        <div class="form-box">

            <input
                type="text"
                id="songName"
                placeholder="Enter Song Name">

            <input
                type="text"
                id="artistName"
                placeholder="Enter Artist Name">

            <button onclick="addSong()">
                Add Song
            </button>

        </div>


        <!-- PLAYLIST -->

        <h2>My Playlist</h2>

        <div id="playlist"></div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="searchSong"
                placeholder="Search Song">

            <button onclick="findSong()">
                Search
            </button>

        </div>


        <!-- MESSAGE -->

        <p id="message"></p>

    </div>


    <script>

        // ==========================================
        // NODE
        // ==========================================

        class Song {

            constructor(name, artist) {

                this.name = name;

                this.artist = artist;

                // Pointer to next node
                this.next = null;
            }
        }


        // ==========================================
        // SINGLY LINKED LIST
        // ==========================================

        class Playlist {

            constructor() {

                // Head points to first node
                this.head = null;
            }


            // ======================================
            // INSERTION
            // ======================================

            addSong(name, artist) {

                let newSong =
                    new Song(name, artist);


                // If playlist is empty
                if (this.head === null) {

                    this.head = newSong;

                }

                // If playlist is not empty
                else {

                    let temp = this.head;


                    // Move to last node
                    while (temp.next !== null) {

                        temp = temp.next;
                    }


                    // Connect last node to new node
                    temp.next = newSong;
                }
            }


            // ======================================
            // SEARCHING
            // ======================================

            searchSong(name) {

                let searchName =
                    name.trim().toLowerCase();


                let temp = this.head;


                // Traverse the linked list
                while (temp !== null) {

                    if (
                        temp.name
                            .trim()
                            .toLowerCase()
                        === searchName
                    ) {

                        return temp;
                    }


                    temp = temp.next;
                }


                // Song not found
                return null;
            }


            // ======================================
            // DELETION
            // ======================================

            deleteSong(name) {

                if (this.head === null) {

                    return false;
                }


                let deleteName =
                    name.trim().toLowerCase();


                // Delete first node
                if (
                    this.head.name
                        .trim()
                        .toLowerCase()
                    === deleteName
                ) {

                    this.head =
                        this.head.next;

                    return true;
                }


                let temp = this.head;


                // Find the node
                while (temp.next !== null) {

                    if (
                        temp.next.name
                            .trim()
                            .toLowerCase()
                        === deleteName
                    ) {

                        // Remove the node
                        temp.next =
                            temp.next.next;

                        return true;
                    }


                    temp = temp.next;
                }


                return false;
            }

        }


        // ==========================================
        // CREATE PLAYLIST
        // ==========================================

        let playlist =
            new Playlist();


        // ==========================================
        // ADD SONG FUNCTION
        // ==========================================

        function addSong() {

            let songName =
                document
                .getElementById("songName")
                .value
                .trim();


            let artistName =
                document
                .getElementById("artistName")
                .value
                .trim();


            // Check empty fields
            if (
                songName === ""
                ||
                artistName === ""
            ) {

                alert(
                    "Please enter song name and artist name."
                );

                return;
            }


            // Add song to linked list
            playlist.addSong(
                songName,
                artistName
            );


            // Clear input fields
            document
                .getElementById("songName")
                .value = "";


            document
                .getElementById("artistName")
                .value = "";


            // Clear previous message
            document
                .getElementById("message")
                .innerText = "";


            // Display playlist
            displayPlaylist();
        }


        // ==========================================
        // DISPLAY PLAYLIST
        // ==========================================

        function displayPlaylist() {

            let playlistDiv =
                document
                .getElementById("playlist");


            // Clear old playlist
            playlistDiv.innerHTML = "";


            let temp =
                playlist.head;


            // Traverse linked list
            while (temp !== null) {

                let songDiv =
                    document
                    .createElement("div");


                songDiv.className =
                    "song";


                songDiv.innerHTML =

                    `
                    <div class="song-info">

                        🎵 <b>${temp.name}</b>

                        <br>

                        🎤 ${temp.artist}

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteSong('${temp.name}')">

                        Delete

                    </button>
                    `;


                playlistDiv
                    .appendChild(songDiv);


                // Move to next node
                temp =
                    temp.next;
            }
        }


        // ==========================================
        // DELETE SONG FUNCTION
        // ==========================================

        function deleteSong(name) {

            let deleted =
                playlist.deleteSong(name);


            if (deleted) {

                document
                    .getElementById("message")
                    .innerText =
                    "✅ Song deleted successfully!";

            }

            else {

                document
                    .getElementById("message")
                    .innerText =
                    "❌ Song not found!";
            }


            // Refresh playlist
            displayPlaylist();
        }


        // ==========================================
        // SEARCH SONG FUNCTION
        // ==========================================

        function findSong() {

            let name =
                document
                .getElementById("searchSong")
                .value
                .trim();


            // Empty search
            if (name === "") {

                document
                    .getElementById("message")
                    .innerText =
                    "⚠️ Please enter a song name.";

                return;
            }


            // Search in linked list
            let result =
                playlist.searchSong(name);


            if (result !== null) {

                document
                    .getElementById("message")
                    .innerText =
                    "🎵 Song Found: "
                    +
                    result.name
                    +
                    " - "
                    +
                    result.artist;

            }

            else {

                document
                    .getElementById("message")
                    .innerText =
                    "❌ Song not found!";
            }
        }

    </script>

</body>
</html>
